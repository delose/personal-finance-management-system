# Common Application Settings
spring.application.name=api-gateway
server.port=8080

# Default profile
spring.profiles.active=dev

# JWT Settings
jwt.secret=secret
jwt.token.expiration-in-seconds=3600
security.jwt.secret-key=e4cb27640b5c8381faab89deab53422f40fe2483b63a7d2ef8f140e03e131b66
security.jwt.expiration-time=3600000

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.delose.pfms=DEBUG

# Gateway Infrastructure
spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=reactive

# Routes Definition (Using Eureka 'lb://' for Load Balancing)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.routes[1].id=budget-service
spring.cloud.gateway.routes[1].uri=lb://budget-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/v1/api/budgets/**

spring.cloud.gateway.routes[2].id=expense-service
spring.cloud.gateway.routes[2].uri=lb://expense-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/expenses/**

spring.cloud.gateway.routes[3].id=goal-service
spring.cloud.gateway.routes[3].uri=lb://goal-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/goals/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://notification-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.routes[5].id=reporting-service
spring.cloud.gateway.routes[5].uri=lb://reporting-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/reporting/**

spring.cloud.gateway.routes[6].id=config-server
spring.cloud.gateway.routes[6].uri=lb://config-server
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/config/**
#spring.cloud.gateway.routes[6].filters[0]=StripPrefix=1

# Management
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
