server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/delose/personal-finance-management-system.git
          search-paths: config-repo
          clone-on-start: true
          default-label: master
    #   fail-fast: true
management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always