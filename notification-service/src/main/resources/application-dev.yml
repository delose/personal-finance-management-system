spring:
  kafka:
    bootstrap-servers: global-service-kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "*"
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  data:
    mongodb:
      uri: "mongodb://admin:secret@localhost:3308/notifdb?authSource=admin"
  output.ansi.enabled: ALWAYS
  cloud:
    config:
      uri: http://localhost:8085  # The address of the Notification service
    consul:
      discovery:
        healthCheckPath: /notif-health-check
        healthCheckInterval: 20s
      host: localhost
      port: 8500
      config:
        import: "optional:consul:${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}"
        enabled: false