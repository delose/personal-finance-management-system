services:
  rabbitmq:
    image: rabbitmq:4-management  # Use the latest 2025 version with UI
    container_name: rabbitmq-demo
    ports:
      - "5672:5672"   # AMQP protocol port for apps to connect
      - "15672:15672" # Web Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
