services:
  consul-server:
    image: hashicorp/consul:latest
    container_name: consul-server
    ports:
      - "8500:8500"
      - "8600:8600/udp" # Added for DNS queries if needed
    command: >
      agent -server -ui 
      -node=server-1 
      -bootstrap-expect=1 
      -client=0.0.0.0
      -data-dir=/consul/data
    restart: always
    volumes:
      - consul_data:/consul/data
    healthcheck:
      # Using consul's internal command is more reliable than curl
      test: ["CMD", "consul", "operator", "raft", "list-peers"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  consul_data: