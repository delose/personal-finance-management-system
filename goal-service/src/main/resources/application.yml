server:
  port: 8084
spring:
  application:
    name: goal-service
  datasource:
    url: jdbc:h2:mem:goalsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Fix for: No spring.config.import property has been defined
  config:
    import: optional:consul:localhost:8500

management:
  endpoints:
    web:
      exposure:
        include: "*"