services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pfms-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP (used by Spring Boot)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - pfms-network

networks:
  pfms-network:
    name: pfms-network
    external: true
