version: '3.8'
services:
  laravel.test:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - CONSUL_HOST=consul-server
      - CONSUL_PORT=8500
      - CONSUL_SERVICE_NAME=expense-service
      - CONSUL_SERVICE_ID=expense-service
    volumes:
      - .:/var/www/html
    networks:
      - laravel-network
      - consul-network
    depends_on:
      - consul-agent
    command: >
      sh -c "
        php artisan serve --host=0.0.0.0 --port=80 &
        ./register-with-consul.sh &
        wait
      "

  consul-agent:
    image: consul:latest
    container_name: expense-consul-agent
    command: >
      agent 
      -dev 
      -node=expense-service 
      -join=consul-server
    restart: always
    volumes:
      - ./consul-service.json:/consul/config/expense-service.json
    ports:
      - "8501:8500"
    networks:
      - consul-network
    depends_on:
      - consul-server

  consul-server:
    image: consul:latest
    container_name: expense-consul-server
    ports:
      - "8500:8500"
    command: >
      agent -server -ui 
      -node=server-1 
      -bootstrap-expect=1 
      -client=0.0.0.0
    restart: always
    volumes:
      - consul_data:/consul/data
    networks:
      - consul-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  laravel-network:
    driver: bridge
  consul-network:
    driver: bridge

volumes:
  consul_data:
